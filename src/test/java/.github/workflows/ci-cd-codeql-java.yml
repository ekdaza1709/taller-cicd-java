name: CI/CD Java + CodeQL + Mock Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '17'

jobs:
  build_test:
    name: Build & JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Build (Maven) + Tests
        run: mvn -B -ntp clean verify

  codeql:
    name: Code Scanning (CodeQL)
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  deploy:
    name: Deploy to Cloud Environment
    needs: [build_test, codeql]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Simulating Deployment
        run: |
          echo "Connecting to production environment..."
          echo "Deploying artifact target/taller-cicd-java-1.0-SNAPSHOT.jar..."
          echo "Health check: PASSED"
          echo "Application successfully deployed and running on production cluster!"
